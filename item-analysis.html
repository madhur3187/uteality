<!DOCTYPE html>
<html>

<head>

<title>Item Profit Analyzer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<style>

.modal{

position:fixed;
top:0;
left:0;
right:0;
bottom:0;

background:rgba(0,0,0,0.6);

display:none;

align-items:center;
justify-content:center;

}

.modalBox{

background:#020617;

border:1px solid #1e293b;

padding:20px;

border-radius:12px;

width:400px;

}

.modalTitle{

font-weight:600;
margin-bottom:10px;

}

.closeBtn{

float:right;
cursor:pointer;

}

</style>

</head>

<body>


<div class="app">


<div class="sidebar">

<div class="logo">
  <img src="assets/logo_transparent.png" alt="uTEAlity Logo">
</div>

<a class="menuItem" href="dashboard.html">Dashboard</a>
<a class="menuItem" href="order.html">New Order</a>
<a class="menuItem" href="reports.html">Reports</a>
<a class="menuItem active" href="item-analysis.html">Item Analysis</a>
<a class="menuItem" href="settings.html">Settings</a>

</div>



<div class="main">


<div class="topbar">

<div class="topbarTitle">Item Profit Analyzer</div>
<div class="topbarRight">Cloud Kitchen Panel</div>

</div>



<div class="content">

<div class="statsGrid">

<div class="statCard">

<div>Best Seller</div>

<div id="bestSeller">-</div>

</div>

<div class="statCard">

<div>Highest Profit</div>

<div id="bestProfit">-</div>

</div>

<div class="statCard">

<div>Lowest Margin</div>

<div id="worstMargin">-</div>

</div>

</div>

<table class="reportTable">

<thead>

<tr>

<th>Item</th>

<th>Qty Sold</th>

<th>Revenue</th>

<th>Profit</th>

<th>Margin %</th>

<th>Pricing Advice</th>

</tr>

</thead>

<tbody id="analysisBody"></tbody>

</table>
</div>
</div>

<script>

async function loadAnalysis(){

let { data: orders } =
await db
.from("orders")
.select("*")

let { data: menu } =
await db
.from("menu_items")
.select("*")

let stats = {}

orders.forEach(order=>{

(order.items || []).forEach(item=>{

let name = item.name

let qty = Number(item.qty || 1)

if(!stats[name]){

stats[name] = {

qty:0,

revenue:0,

profit:0

}

}

stats[name].qty += qty


let menuItem =
menu.find(m => m.name === name)

let price =
Number(menuItem?.price || 0)

stats[name].revenue +=
(price * qty)

let cost =
Number(menuItem?.cost || 0)

let itemRevenue =
price * qty


// ORDER LEVEL TOTALS

let orderRevenue =
Number(order.total || 0)

let orderCommission =
Number(order.commission || 0)


// Packaging total

let orderPackaging = 0

if(Array.isArray(order.packaging)){

order.packaging.forEach(p=>{

orderPackaging +=
Number(p.price || 0)
*
Number(p.qty || 0)

})

}


// Item share %

let share = 0

if(orderRevenue > 0){

share =
itemRevenue / orderRevenue

}


// Allocate deductions

let itemCommission =
orderCommission * share

let itemPackaging =
orderPackaging * share


// Final net profit

let itemProfit =

itemRevenue
-
(cost * qty)
-
itemCommission
-
itemPackaging


stats[name].profit +=
itemProfit


})

})

let body =
document.getElementById("analysisBody")

body.innerHTML = ""

Object.keys(stats).forEach(name=>{

let row = stats[name]

let margin =
row.revenue > 0

?

(row.profit / row.revenue * 100)

:

0

let advice = ""

if(margin < 15){

let suggested =
Math.round(row.revenue / row.qty * 1.10)

advice =
"Try ₹" + suggested

}

else if(margin < 30){

advice = "Good"

}

else{

advice = "Strong"

}

body.innerHTML += `

<tr>

<td>${name}</td>

<td>${row.qty}</td>

<td>₹ ${row.revenue.toFixed(2)}</td>

<td>₹ ${row.profit.toFixed(2)}</td>

<td>${margin.toFixed(1)}%</td>

<td>${advice}</td>

</tr>

`

})



// SUMMARY CARDS

let bestSeller = ""

let bestSellerQty = 0

let bestProfit = ""

let bestProfitValue = -999999

let worstMargin = ""

let worstMarginValue = 999999


Object
.keys(stats)

.sort((a,b)=>

stats[b].profit
-
stats[a].profit

)

.forEach(name=>{

let row = stats[name]

let margin = 0

if(row.revenue > 0){

margin =
(row.profit / row.revenue) * 100

}


// Best Seller
if(row.qty > bestSellerQty){

bestSellerQty = row.qty

bestSeller = name

}


// Highest Profit
if(row.profit > bestProfitValue){

bestProfitValue = row.profit

bestProfit = name

}


// Worst Margin
if(margin < worstMarginValue){

worstMarginValue = margin

worstMargin = name

}

})


// Update UI

document
.getElementById("bestSeller")
.innerText =

bestSeller + " (" + bestSellerQty + ")"


document
.getElementById("bestProfit")
.innerText =

bestProfit + " ₹" + bestProfitValue.toFixed(0)


document
.getElementById("worstMargin")
.innerText =

worstMargin + " " + worstMarginValue.toFixed(1) + "%"

}

loadAnalysis()

</script>

</body>
</html>
