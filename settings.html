<!DOCTYPE html>
<html>

<head>

<title>Settings</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

</head>

<body>


<div class="app">


<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">
  <img src="assets/logo_transparent.png" alt="uTEAlity Logo">
</div>

<a class="menuItem" href="dashboard.html">
Dashboard
</a>

<a class="menuItem" href="order.html">
New Order
</a>

<a class="menuItem" href="reports.html">
Reports
</a>

<a class="menuItem active" href="settings.html">
Settings
</a>

</div>



<!-- MAIN -->

<div class="main">


<div class="topbar">

<div class="topbarTitle">
Settings
</div>

<div class="topbarRight">
Cloud Kitchen Panel
</div>

</div>



<div class="content">


<!-- CONFIG -->

<div class="card">

<div class="cardTitle">
Config
</div>


<div class="grid">


<div class="formGroup">

<div class="formLabel">
Commission %
</div>

<input id="commission">

</div>


<div class="formGroup">

<div class="formLabel">
Long Distance Fee
</div>

<input id="longFee">

</div>


</div>


<button onclick="saveConfig()">
Save Config
</button>

</div>



<!-- MENU -->

<div class="card">

<div class="cardTitle">
Menu Items
</div>

<div id="menuArea"></div>

<br>

<button onclick="addMenu()">
Add Item
</button>

<button onclick="saveMenu()">
Save Menu
</button>

</div>



<!-- PACKAGING -->

<div class="card">

<div class="cardTitle">
Packaging
</div>

<div id="packArea"></div>

<br>

<button onclick="addPack()">
Add
</button>

<button onclick="savePack()">
Save Packaging
</button>

</div>



</div>
</div>
</div>
</div>


<script>

let menu = []
let pack = []
let config = {
  commission: 0,
  longDistance: 0
}


async function initSettings(){

// SETTINGS
let { data: settingsData, error: settingsError } =
await supabase
.from("settings")
.select("*")
.limit(1)

if(settingsError){
  alert("Settings Error: " + settingsError.message)
}

if(settingsData && settingsData[0]){

  config.commission =
  Number(settingsData[0].commission || 0)

  config.longDistance =
  Number(settingsData[0].long_distance || 0)

}

document.getElementById("commission").value =
config.commission

document.getElementById("longFee").value =
config.longDistance


// MENU
let { data: menuData, error: menuError } =
await supabase
.from("menu_items")
.select("*")

if(menuError){
  alert("Menu Error: " + menuError.message)
}

menu = menuData || []


// PACKAGING
let { data: packData, error: packError } =
await supabase
.from("packaging")
.select("*")

if(packError){
  alert("Packaging Error: " + packError.message)
}

pack = packData || []
loadMenu()
loadPack()

}

async function saveConfig(){

config.commission=
Number(document.getElementById("commission").value)

config.longDistance=
Number(document.getElementById("longFee").value)


let { error } =
await supabase
.from("settings")
.upsert([{
  id: 1,
  commission: config.commission,
  long_distance: config.longDistance
}])

if(error){
  alert(error.message)
  return
}

alert("Saved")

}



function loadMenu(){

let d=document.getElementById("menuArea")

d.innerHTML=""

menu.forEach(m=>{

let n = document.createElement("input")
n.value = m.name
n.placeholder = "Item Name"

let p = document.createElement("input")
p.value = m.price
p.placeholder = "Selling Price"

let c = document.createElement("input")
c.value = m.cost || 0
c.placeholder = "Making Cost"

let row = document.createElement("div")
row.className = "menuRow"

row.appendChild(n)
row.appendChild(p)
row.appendChild(c)

d.appendChild(row)

})

}




function addMenu(){

menu.push({
  name: "Item",
  price: 0,
  cost: 0
})

loadMenu()

}



async function saveMenu(){

let inputs=document
.querySelectorAll("#menuArea input")

menu=[]

for(let i=0;i<inputs.length;i+=3){

menu.push({

  name: inputs[i].value,

  price: Number(inputs[i+1].value),

  cost: Number(inputs[i+2].value)
})

}

let { error } =
await supabase
.from("menu_items")
.insert(menu)

if(error){
  alert(error.message)
  return
}

alert("Saved")

}



function loadPack(){

let d=document.getElementById("packArea")

d.innerHTML=""

pack.forEach(m=>{

let n=document.createElement("input")
n.value=m.name

let p=document.createElement("input")
p.value=m.price

d.appendChild(n)
d.appendChild(p)

d.appendChild(document.createElement("br"))

})

}


function addPack(){

pack.push({name:"Item",price:0})

loadPack()

}



async function savePack(){

let inputs=document
.querySelectorAll("#packArea input")

pack=[]

for(let i=0;i<inputs.length;i+=2){

pack.push({

name:inputs[i].value,
price:Number(inputs[i+1].value)

})

}

let { error } =
await supabase
.from("packaging")
.insert(pack)

if(error){
  alert(error.message)
  return
}

alert("Saved")

}

initSettings()
</script>


</body>
</html>
