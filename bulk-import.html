<script>

/* =====================================================
   GLOBAL DATA
===================================================== */

let importedOrders = [];
let menu = [];

/* =====================================================
   MENU DATA
===================================================== */
async function loadMenu() {

    const { data, error } = await db
        .from("menu_items")
        .select("id,name,price,cost,default_packaging");

    if (error) {

        console.error(
            "Error loading menu:",
            error
        );

        showMessage(
            "Could not load menu items: " + error.message,
            true
        );

        return false;
    }

    menu = data || [];

    console.log(
        "Menu items loaded:",
        menu.length
    );

    return true;
}

/* =====================================================
   READ ORDER FILE
===================================================== */

async function readOrderFile() {

    const fileInput =
        document.getElementById("orderFile");

    const file = fileInput.files[0];


    if (!file) {

        alert("Please select a CSV file first.");

        return;

    }
    const menuLoaded = await loadMenu();

    if (!menuLoaded) {
        return;
    }


    const platform =
        document.getElementById("platform").value;


    if (platform !== "zomato") {

        alert(
            "Swiggy importer is not built yet. We will add it after Zomato is working."
        );

        return;

    }


    const reader = new FileReader();


    reader.onload = function(event) {

        try {

            const csvText =
                event.target.result;


            parseZomatoCSV(csvText);


        } catch (error) {

            console.error(error);

            showMessage(
                "Error reading file: " + error.message,
                true
            );

        }

    };


    reader.readAsText(file);

}



/* =====================================================
   CSV PARSER
===================================================== */

function parseCSVLine(line) {

    const result = [];

    let current = "";

    let insideQuotes = false;


    for (let i = 0; i < line.length; i++) {

        const char = line[i];

        const nextChar =
            line[i + 1];


        if (char === '"' && insideQuotes && nextChar === '"') {

            current += '"';

            i++;

            continue;

        }


        if (char === '"') {

            insideQuotes = !insideQuotes;

            continue;

        }


        if (char === "," && !insideQuotes) {

            result.push(current);

            current = "";

            continue;

        }


        current += char;

    }


    result.push(current);


    return result;

}



/* =====================================================
   PARSE ZOMATO CSV
===================================================== */

function parseZomatoCSV(csvText) {

    const lines =
        csvText
            .replace(/\r/g, "")
            .split("\n")
            .filter(line => line.trim() !== "");


    if (lines.length < 2) {

        throw new Error(
            "The CSV file does not contain any order data."
        );

    }


    const headers =
        parseCSVLine(lines[0])
            .map(header => header.trim());


    console.log("Zomato headers:", headers);


    importedOrders = [];


    for (let i = 1; i < lines.length; i++) {

        const values =
            parseCSVLine(lines[i]);


        if (values.length !== headers.length) {

            console.warn(
                "Skipping malformed row:",
                i + 1,
                values
            );

            continue;

        }


        const row = {};


        headers.forEach((header, index) => {

            row[header] =
                values[index]?.trim() || "";

        });


        importedOrders.push(row);

       if (importedOrders.length <= 5) {

    const parsedItems =
        parseOrderItems(row["Items in order"]);

    const matchedItems =
        parsedItems.map(item => ({
            ...item,
            ...matchMenuItem(item.name)
        }));

if (importedOrders.length <= 1) {

    console.log("========== RAW ZOMATO ORDER ==========");
    console.log(row);

    const financials =
        calculateImportedOrder(row);

    console.log("========== ORDER FINANCIALS ==========");
    console.log({
        orderId: row["Order ID"],
        items: financials.items,
        makingCost: financials.makingCost,
        unknownItems: financials.unknownItems
    });

}

}

    }


    console.log(
        "Imported Zomato rows:",
        importedOrders
    );


    displayOrders();

}

/* =====================================================
   PARSE ZOMATO ITEMS
===================================================== */

function parseOrderItems(itemsText) {

    if (!itemsText) {
        return [];
    }

    const items = [];

    /*
       Example:

       1 x Sabudana Khichdi, 1 x Sabudana Vada

       becomes:

       [
           {
               name: "Sabudana Khichdi",
               qty: 1
           },
           {
               name: "Sabudana Vada",
               qty: 1
           }
       ]
    */

    const parts = itemsText.split(",");

    parts.forEach(part => {

        part = part.trim();

        if (!part) {
            return;
        }

        const match =
            part.match(/^(\d+)\s*x\s*(.+)$/i);

        if (match) {

            const qty =
                parseInt(match[1], 10);

            const name =
                match[2].trim();

            items.push({
                name: name,
                qty: qty
            });

        } else {

            /*
               If Zomato gives an unexpected format,
               keep the item rather than losing it.
            */

            items.push({
                name: part,
                qty: 1
            });

        }

    });

    return items;
}

/* =====================================================
   MATCH ITEMS WITH SUPABASE MENU
===================================================== */

function matchMenuItem(itemName) {

    const normalizedName =
        itemName
            .trim()
            .toLowerCase();

    const matched =
        menu.find(item =>
            item.name
                .trim()
                .toLowerCase() === normalizedName
        );

    if (!matched) {

        return {
            matched: false,
            importedName: itemName
        };

    }

    return {
        matched: true,
        importedName: itemName,
        menuId: matched.id,
        menuName: matched.name,
        sellingPrice: Number(matched.price) || 0,
        makingCost: Number(matched.cost) || 0,
        defaultPackaging: matched.default_packaging || []
    };
}

/* =====================================================
   CALCULATE IMPORTED ORDER FINANCIALS
===================================================== */

function calculateImportedOrder(order) {

    const parsedItems =
        parseOrderItems(order["Items in order"]);

    let makingCost = 0;
    let items = [];
    let unknownItems = [];

    parsedItems.forEach(item => {

        const matched =
            matchMenuItem(item.name);

        if (!matched.matched) {

            unknownItems.push(item.name);

            return;
        }

        const itemMakingCost =
            matched.makingCost * item.qty;

        makingCost += itemMakingCost;

        items.push({
            name: matched.menuName,
            qty: item.qty,
            price: matched.sellingPrice,
            cost: matched.makingCost,
            totalCost: itemMakingCost,
            menuId: matched.menuId
        });

    });

    return {
        items: items,
        makingCost: makingCost,
        unknownItems: unknownItems
    };
}

/* =====================================================
   CALCULATE IMPORTED ORDER FINANCIALS
===================================================== */

function calculateImportedOrder(order) {

    const parsedItems =
        parseOrderItems(order["Items in order"]);

    let makingCost = 0;
    let items = [];
    let unknownItems = [];

    parsedItems.forEach(item => {

        const matched =
            matchMenuItem(item.name);

        if (!matched.matched) {

            unknownItems.push(item.name);

            return;
        }

        const itemMakingCost =
            matched.makingCost * item.qty;

        makingCost += itemMakingCost;

        items.push({
            name: matched.menuName,
            qty: item.qty,
            price: matched.sellingPrice,
            cost: matched.makingCost,
            totalCost: itemMakingCost,
            menuId: matched.menuId
        });

    });

    return {
        items: items,
        makingCost: makingCost,
        unknownItems: unknownItems
    };
}

/* =====================================================
   DISPLAY ORDERS
===================================================== */

function displayOrders() {

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    tbody.innerHTML = "";


    let delivered = 0;

    let cancelled = 0;

    let unknownItems = 0;


    importedOrders.forEach(order => {

        const status =
    (order["Order Status"] || "")
        .toLowerCase()
        .trim();

const cancellationReason =
    (order["Cancellation / Rejection reason"] || "")
        .toLowerCase()
        .trim();


if (status === "delivered") {

    delivered++;

}


if (
    status.includes("cancel") ||
    cancellationReason.includes("cancel")
) {

    cancelled++;

}


        const tr =
            document.createElement("tr");


        tr.innerHTML = `

            <td>
                ${escapeHTML(order["Order ID"])}
            </td>

            <td>
                ${escapeHTML(order["Order Placed At"])}
            </td>

            <td>
                ${escapeHTML(order["Order Status"])}
            </td>

            <td>
                ${escapeHTML(order["Items in order"])}
            </td>

            <td>
                ₹${formatNumber(order["Bill subtotal"])}
            </td>

            <td>
                ₹${formatNumber(
                    calculateDiscount(order)
                )}
            </td>

            <td>
                ₹${formatNumber(
                    order["Packaging charges"]
                )}
            </td>

            <td>
                ₹${formatNumber(order["Total"])}
            </td>

        `;


        tbody.appendChild(tr);

    });


    document.getElementById(
        "ordersFound"
    ).innerText =
        importedOrders.length;


    document.getElementById(
        "deliveredOrders"
    ).innerText =
        delivered;


    document.getElementById(
        "cancelledOrders"
    ).innerText =
        cancelled;


    document.getElementById(
        "unknownItems"
    ).innerText =
        unknownItems;


    document.getElementById(
        "summarySection"
    ).classList.remove("hidden");


    document.getElementById(
        "ordersSection"
    ).classList.remove("hidden");


    showMessage(
        `Successfully read ${importedOrders.length} orders.`
    );

}



/* =====================================================
   DISCOUNT CALCULATION
===================================================== */

function calculateDiscount(order) {

    const promo =
        Number(
            order[
                "Restaurant discount (Promo)"
            ]
        ) || 0;


    const flat =
        Number(
            order[
                "Restaurant discount (Flat offs, Freebies & others)"
            ]
        ) || 0;


    const gold =
        Number(
            order["Gold discount"]
        ) || 0;


    const brand =
        Number(
            order["Brand pack discount"]
        ) || 0;


    return promo + flat + gold + brand;

}



/* =====================================================
   NUMBER FORMAT
===================================================== */

function formatNumber(value) {

    const number =
        Number(value);


    if (isNaN(number)) {

        return "0.00";

    }


    return number.toFixed(2);

}



/* =====================================================
   HTML SAFETY
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(message, isError = false) {

    const element =
        document.getElementById("message");


    element.innerText =
        message;


    element.style.color =
        isError ? "red" : "green";

}
